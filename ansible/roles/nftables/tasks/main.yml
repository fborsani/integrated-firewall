---
- name: Create Pi-hole directories
  ansible.builtin.file:
    path: "{{ nftables_work_dir }}"
    state: directory
    owner: "{{ global.file_owner }}"
    group: "{{ global.file_group }}"
    mode: "{{ global.file_perms }}"

- name: Check if nftables.conf is already configured
  ansible.builtin.lineinfile:
    path: "{{ nftables_default_table }}"
    regexp: '^{{ nftables_default_table_managed_tag }}$'
    state: absent
  check_mode: true
  changed_when: false
  register: resolv_conf_marker

- name: Backup default config
  ansible.builtin.include_role:
    name: utils
    tasks_from: backup_restore_file
  vars:
    source_file: "{{ nftables_default_table }}"
    backup_folder: "{{ nftables_work_dir }}"
    mode: backup

- name: Generate rules
  block:
    - name: Create DNS firewall rules
      ansible.builtin.template:
        src: dns_blacklist.nft.j2
        dest: "{{ nftables_dns_rule_table_file }}"
        owner: "{{ global.file_owner }}"
        group: "{{ global.file_group }}"
        mode: "{{ global.file_perms }}"
        validate: 'nft -c -f %s'
      when: pihole.enabled

    - name: Generate blacklists
      ansible.builtin.import_tasks: 
        file: generate_blacklists.yml
      when: nftables.always_reload_lists

    - name: Check if generated blacklist is present
      stat:
        path: "{{ nftables_blacklist_rule_output_file }}"
      register: generated_rule_file

    - name: Flush current configuration
      ansible.builtin.shell: "/usr/sbin/nft delete table inet {{ nftables_root_table }} 2>/dev/null || true"
      args:
        executable: /bin/sh

    - name: Deploy blacklist nftables rule
      ansible.builtin.template:
        src: blacklist.nft.j2
        dest: "{{ nftables_work_dir }}/blacklist.nft"
        owner: "{{ global.file_owner }}"
        group: "{{ global.file_group }}"
        mode: "0644"
        validate: 'nft -c -f %s'
  rescue:
    - name: Restore default config
      ansible.builtin.include_role:
        name: utils
        tasks_from: backup_restore_file
      vars:
        source_file: "{{ nftables_default_table }}"
        backup_folder: "{{ nftables_work_dir }}"
        mode: restore

    - name: Fail
      ansible.builtin.fail:
        msg: "Nftables configuration failed. Review previous tasks outcomes for errors"
    

- name: Reload nftables
  ansible.builtin.systemd:
    name: "{{ nftables_service_name }}"
    enabled: true
    state: reloaded