global:
  timezone: Europe/Rome
  work_dir: "/opt/integrated-firewall"
  python_venv: ""
  file_owner: "root"
  file_group: "root"
  file_perms: "755"

tailscale:
  enabled: true
  version: "latest"
  shields_up: false
  auth_key: ""  #your tailscale API key
  host_config:
    hostname: "home-exit"
    accept_routes: true
    ssh_enabled: false
    advertise_tags: []

pihole:
  enabled: true
  version: "latest"
  always_reload_lists: true
  dashboard:
    enabled: false
    port: 8080
    web_password: ""
  upstream_dns:
    - 1.1.1.1
    - 1.0.0.1
  subnet: 172.28.0.0/16
  gateway_ip: 172.28.0.1
  resolver_ipv4_address: "172.28.0.2"
  blacklists:
    local: []
#     - /etc/blocklist.txt
#     - /etc/lists  <-- all files under this folder will be included. Subfolders are ignored
    remote: []
  whitelists:
    local: []
#     - /etc/allowlist.txr
#     - /etc/lists  <-- all files under this folder will be included. Subfolders are ignored
    remote: []
  user_defined_domains: []
#    - domain: domain.com
#      action: allow|deny
#      match: exact|regex|wildcard
# match explanation:
# - exact: match only the specified domain
# - regex: treat the domain field as a regex
# - wildcard: match the domain and all subdomains akin to doing *.domain.com

nftables:
  enabled: true
  always_reload_lists: false
  remote_download_workers: 5
  remote_blacklists: []
  local_blacklists: []
  user_defined_banned_ips:
    ipv4: []
    ipv6: []
  